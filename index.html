<!DOCTYPE html>
<html lang="es">
<head>
    <meta utmp="true" content="1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-container">
    <div class="dashboard">
        <div id="expense-widget" class="widget">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Gastos Compartidos</h2>
            <p id="balance-text" style="font-size: 1.5rem; font-weight: bold; color: var(--accent-color);">Saldo: $0</p>
            <p style="font-size: 0.9rem; color: var(--text-secondary);">Estado de cuentas con pareja</p>
            <p id="debt-status" style="font-size: 1rem; font-weight: bold; margin-bottom: 5px;">Cargando estado...</p>
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <input type="number" id="expenseAmount" placeholder="Monto (ej. 1000)" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
                <input type="text" id="expenseDesc" placeholder="Descripción (ej. Super)" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
                <select id="expenseCategory" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Otros">Otros</option>
                </select>
                <select id="expensePayer" style="padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);">
                    <option value="me">Tin</option>
                    <option value="partner">Noe</option>
                </select>
                <button onclick="submitExpense(document.getElementById('expenseAmount').value, document.getElementById('expenseDesc').value)" style="padding: 10px; border-radius: 8px; background: var(--accent-color); color: white; border: none; cursor: pointer; font-weight: bold;">Agregar Gasto</button>
            </div>
        </div>
        <div id="history-widget" class="widget">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Historial de Gastos</h2>
            <div>
                <table id="history-table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 8px; text-align: left;">Fecha</th>
                            <th style="padding: 8px; text-align: left;">Descripción</th>
                            <th style="padding: 8px; text-align: left;">Categoría</th>
                            <th style="padding: 8px; text-align: center;">Monto</th>
                            <th style="padding: 8px; text-align: left;">Pagador</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr style="padding: 20px; text-align: center;">Cargando historial...</tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="chart-widget" class="widget">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Distribución por Categoría</h2>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <div id="theme-selector-container">
        <div class="controls-group">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dracula">Dracula</option>
                <option value="nord">Nord (Midnight)</option>
                <option value="github">GitHub Light</option>
            </select>
            <button onclick="alert('Settings menu')" style="padding: 8px; border-radius: 10px; background: var(--card-bg); color: var(--text-primary); border: 2px solid var(--border-color); cursor: pointer; font-weight: bold; margin-left: 5px;">Settings</button>
        </div>
        <div id="clock" class="mini-clock">
            <h2 id="clockDisplay">00:00:00</h2>
            <p id="dateDisplay">-- -- ----</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/_loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
