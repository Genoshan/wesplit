<!DOCTYPE html>
<html lang="es">
<head>
    <meta utmp="true" content="1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-container">
    <div class="dashboard">
        <div id="expense-widget" class="widget">
            <h2 class="widget-title">Gastos Compartidos</h2>
            <p id="balance-text">Saldo: $0</p>
            <p class="status-label">Estado de cuentas con pareja</p>
            <p id="debt-status">Cargando estado...</p>
            <div class="form-container">
                <input type="number" id="expenseAmount" placeholder="Monto (ej. 1000)" class="form-control">
                <input type="text" id="expenseDesc" placeholder="Descripción (ej. Super)" class="form-control">
                <select id="expenseCategory" class="form-control">
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Ocio">Ocio</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Otros">Otros</option>
                </select>
                <select id="expensePayer" class="form-control">
                    <option value="me">Tin</option>
                    <option value="partner">Noe</option>
                </select>
                <button onclick="submitExpense(document.getElementById('expenseAmount').value, document.getElementById('expenseDesc').value)" class="btn-action">Agregar Gasto</button>
            </div>
        </div>
        <div id="history-widget" class="widget">
            <h2 class="widget-title">Historial de Gastos</h2>
            <input type="text" id="search-input" placeholder="Buscar por descripción..." class="form-control">
                <table id="history-table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 8px; text-align: left;">Fecha</th>
                            <th style="padding: 8px; text-align: left;">Descripción</th>
                            <th style="padding: 8px; text-align: left;">Categoría</th>
                            <th style="padding: 8px; text-align: center;">Monto</th>
                            <th style="padding: 8px; text-align: left;">Pagador</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr style="padding: 20px; text-align: center;">Cargando historial...</tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="chart-widget" class="widget">
            <h2 class="widget-title">Distribución por Categoría</h2>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <div id="theme-selector-container">
        <div class="controls-group">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dracula">Dracula</option>
                <option value="nord">Nord (Midnight)</option>
                <option value="github">GitHub Light</option>
            </select>
            <button onclick="alert('Settings menu')" style="padding: 8px; border-radius: 10px; background: var(--card-bg); color: var(--text-primary); border: 2px solid var(--border-color); cursor: pointer; font-weight: bold; margin-left: 5px;">Settings</button>
        </div>
        <div id="clock" class="mini-clock">
            <h2 id="clockDisplay">00:00:00</h2>
            <p id="dateDisplay">-- -- ----</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/_loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
