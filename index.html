<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Compartidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="login-screen" hidden>
        <div class="login-card">
            <div class="section-heading">
                <p class="eyebrow">Gastos Compartidos</p>
                <h1>Iniciar Sesión</h1>
            </div>
            <form id="login-form">
                <label for="login-username">Usuario</label>
                <select id="login-username" class="form-select" required>
                    <option value="tin">Tin</option>
                    <option value="noe">Noe</option>
                </select>
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" class="form-control" placeholder="Contraseña" required>
                <p id="login-error" class="text-danger small" role="status"></p>
                <button type="submit" class="btn btn-primary btn-action w-100">Ingresar</button>
            </form>

            <div id="google-login-section" hidden>
                <div class="login-divider">o continuar con</div>
                <button type="button" id="google-login-btn" class="btn btn-google w-100">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.84 0-5.25-1.92-6.12-4.52H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.88 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.85-.62z"/>
                        <path fill="#EA4335" d="M12 4.81c1.69 0 3.22.58 4.43 1.73l3.33-3.33C16.68 1.05 13.97 0 12 0 7.7 0 3.99 2.47 2.18 6.36l3.57 2.77c.87-2.6 3.28-4.32 6.25-4.32z"/>
                    </svg>
                    Continuar con Google
                </button>
            </div>
        </div>
    </div>

    <main class="app-shell" id="app-screen" hidden>
        <header class="app-header">
            <div>
                <h1>Gastos Compartidos</h1>
            </div>
            <div class="header-actions">
                <button id="new-group-btn" class="btn btn-sm btn-outline-primary" title="Crear nuevo grupo">+ Grupo</button>
                <select id="group-selector" class="form-select form-select-sm" aria-label="Seleccionar grupo"></select>
                <span id="user-display-name" class="user-label"></span>
                <select id="themeSelect" class="form-select form-select-sm theme-select"
                        onchange="changeTheme(this.value)" aria-label="Seleccionar tema">
                        <option value="dracula">Dracula</option>
                        <option value="nord">Nord</option>
                        <option value="github">GitHub</option>
                </select>
                <button id="logout-btn" class="btn btn-sm btn-outline-secondary" onclick="logout()">Salir</button>
            </div>
        </header>

        <section class="balance-panel" aria-labelledby="balance-title">
            <div>
                <p class="eyebrow">Balance actual</p>
                <h2 id="balance-title">Estado de cuentas</h2>
            </div>
            <div id="balance-display" class="balance-amount"></div>
        </section>

        <div class="content-grid">
            <section class="card app-card" aria-labelledby="form-title">
                <div class="card-body p-4">
                    <div class="section-heading">
                        <p class="eyebrow">Nuevo movimiento</p>
                        <h2 id="form-title">Agregar gasto</h2>
                    </div>

                    <form id="expense-form" class="form-container" onsubmit="event.preventDefault(); toggleExpenseForm(true);">
                        <label for="expense-date">Fecha</label>
                        <input type="date" id="expense-date" class="form-control" required>

                        <label for="expense-description">Descripción</label>
                        <input type="text" id="expense-description" class="form-control" placeholder="Ej. Super" required>

                        <label for="expense-amount">Monto</label>
                        <input type="number" id="expense-amount" class="form-control" min="1" step="0.01" required>

                        <label for="expense-category">Categoría</label>
                        <select id="expense-category" class="form-select" required>
                            <option value="Alimentación">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Otros">Otros</option>
                        </select>

                        <label for="expense-payer">Pagó</label>
                        <select id="expense-payer" class="form-select" required>
                            <option value="me">Tin</option>
                            <option value="partner">Noe</option>
                        </select>

                        <label>Split</label>
                        <div class="split-mode-selector" role="radiogroup" aria-label="Tipo de división">
                            <label class="split-option">
                                <input type="radio" name="split_mode" value="equal" checked>
                                <span class="split-label">50/50</span>
                            </label>
                            <label class="split-option">
                                <input type="radio" name="split_mode" value="solo">
                                <span class="split-label">Solo pagué yo</span>
                            </label>
                            <label class="split-option">
                                <input type="radio" name="split_mode" value="custom">
                                <span class="split-label">Montos exactos</span>
                            </label>
                        </div>

                        <div id="split-display"></div>

                        <button type="button" class="btn btn-primary btn-action w-100" onclick="submitExpense()">
                            Agregar gasto
                        </button>
                    </form>
                </div>
            </section>

            <section class="card app-card history-card" aria-labelledby="history-title">
                <div class="card-body p-4">
                    <div class="section-heading history-heading">
                        <div>
                            <p class="eyebrow">Actividad</p>
                            <h2 id="history-title">Historial de gastos</h2>
                        </div>
                    </div>

                    <div class="history-filters" aria-label="Filtros del historial">
                        <input type="text" id="search-input" placeholder="Buscar..." class="form-control search-input">
                        <select id="category-filter" class="form-select filter-select" aria-label="Filtrar por categoría">
                            <option value="">Todas las categorías</option>
                            <option value="Alimentación">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Otros">Otros</option>
                        </select>
                        <select id="payer-filter" class="form-select filter-select" aria-label="Filtrar por pagador">
                            <option value="">Todos los pagadores</option>
                            <option value="me">Tin</option>
                            <option value="partner">Noe</option>
                        </select>
                        <select id="month-filter" class="form-select filter-select" aria-label="Filtrar por mes">
                            <option value="">Todos los meses</option>
                        </select>
                    </div>

                    <div id="expense-list" class="expense-list"></div>
                </div>
            </section>
        </div>

        <section class="card app-card chart-card" aria-labelledby="chart-title">
            <div class="card-body p-4">
                <div class="section-heading chart-heading">
                    <div>
                        <p class="eyebrow">Categorías</p>
                        <h2 id="chart-title">Distribución por categoría</h2>
                    </div>
                </div>
                <div class="chart-area">
                    <canvas id="category-chart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <span>v<span id="app-version">—</span></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJeded7ZnvJ" crossorigin="anonymous"></script>
    <!-- Modal crear grupo -->
    <div class="modal fade" id="createGroupModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo grupo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <label for="new-group-name">Nombre</label>
                    <input type="text" id="new-group-name" class="form-control mb-3" placeholder="Ej. Trabajo">
                    <label for="new-group-currency">Moneda base</label>
                    <select id="new-group-currency" class="form-select">
                        <option value="UYU">UYU - Peso uruguayo</option>
                        <option value="USD">USD - Dólar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="ARS">ARS - Peso argentino</option>
                        <option value="BRL">BRL - Real</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary btn-sm" id="confirm-create-group">Crear</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
